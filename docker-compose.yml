# Secrets come from services/.env (copy services/.env.example), the same file
# the services read when run standalone. Everything under `environment:` is
# compose-specific wiring and wins over that file; every other setting has a
# default in the service's own config.
x-shared-env: &shared-env
  env_file:
    - path: ./services/.env
      required: false

services:
  market-data:
    build: ./services/market-data
    <<: *shared-env
    ports:
      - "8001:8001"
    volumes:
      - market_data_db:/app/data
    environment:
      # Used only while DATABASE_URL (services/.env) is blank.
      MARKET_DATA_DB_PATH: /app/data/market_data.db
      DB_SCHEMA: market_data
      GOLD_TZ: Asia/Jakarta

  insight:
    build: ./services/insight
    <<: *shared-env
    ports:
      - "8002:8002"
    volumes:
      - insight_db:/app/data
    environment:
      INSIGHT_DB_PATH: /app/data/insight.db
      DB_SCHEMA: insight
      MARKET_DATA_URL: http://market-data:8001
    depends_on:
      - market-data

  notification:
    build: ./services/notification
    <<: *shared-env
    ports:
      - "3000:3000"
    volumes:
      - notification_db:/app/data
    environment:
      NOTIFICATION_DB_PATH: /app/data/notification.db
      DB_SCHEMA: notification
      MARKET_DATA_URL: http://market-data:8001
      INSIGHT_URL: http://insight:8002
    depends_on:
      - market-data
      - insight

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MARKET_DATA_URL: http://localhost:8001
        VITE_INSIGHT_URL: http://localhost:8002
        VITE_NOTIFICATION_URL: http://localhost:3000
        VITE_AGENT_URL: ${VITE_AGENT_URL:-http://localhost:8003}
    ports:
      - "5173:80"
    depends_on:
      - market-data
      - insight
      - notification

volumes:
  market_data_db:
  insight_db:
  notification_db:
